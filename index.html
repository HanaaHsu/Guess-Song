<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 聽前奏猜歌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
                   "Microsoft JhengHei", sans-serif;
      background: #f7f4ef;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 8px;
    }

    .subtitle {
      font-size: 16px;
      color: #777;
      margin-bottom: 24px;
    }

    .game-card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }

    .cover {
      position: absolute;
      inset: 0;
      background: black;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .cover.hidden {
      display: none;
    }

    .question-number {
      font-size: 15px;
      color: #888;
      margin-bottom: 8px;
    }

    .question {
      font-size: 26px;
      font-weight: bold;
      min-height: 40px;
      margin-bottom: 20px;
    }

    .answer {
      font-size: 22px;
      font-weight: bold;
      margin: 18px 0;
      min-height: 34px;
    }

    .answer.hidden {
      visibility: hidden;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .play-btn {
      background: #222;
      color: white;
    }

    .answer-btn {
      background: #eee;
      color: #333;
    }

    .next-btn {
      background: #ddd;
      color: #333;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      .game-card {
        padding: 18px;
      }

      .question {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 聽前奏猜歌</h1>
  <div class="subtitle">測試版 2.1｜8 秒起始＋每次繼續 5 秒</div>

  <div class="game-card">

    <div class="player-wrapper">
      <div id="player"></div>
      <div class="cover" id="cover">
        🎵 準備好了嗎？
      </div>
    </div>

    <div class="question-number" id="questionNumber">
      第 1 題
    </div>

    <div class="question">
      猜猜這是哪一首歌？
    </div>

    <button class="play-btn" id="playButton" onclick="playIntro()">
      ▶️ 播放前奏
    </button>

    <button class="answer-btn" id="answerButton" onclick="showAnswer()">
      👀 公布答案
    </button>

    <div class="answer hidden" id="answer">
      答案
    </div>

    <button class="next-btn" id="nextButton" onclick="nextSong()">
      ➡️ 下一題
    </button>

    <div class="status" id="status">
      已播放 0 秒
    </div>

  </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

  const songs = [
    {
      id: "DYptgVvkVLQ",
      title: "周杰倫〈晴天〉"
    },
    {
      id: "1GA8z-Wliew",
      title: "蔡依林〈日不落〉"
    },
    {
      id: "_GrTlZOGVic",
      title: "林俊傑〈江南〉"
    }
  ];

  let shuffledSongs = [];
  let currentIndex = 0;

  let player;
  let isPlaying = false;
  let timer = null;

  let playedSeconds = 0;

  // 第一次播放 8 秒
  const firstPlaySeconds = 8;

  // 之後每次增加 5 秒
  const continuePlaySeconds = 5;


  // 洗牌
  function shuffle(array) {
    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
  }


  function prepareGame() {
    shuffledSongs = shuffle(songs);
    currentIndex = 0;
    loadSong();
  }


  function loadSong() {

    clearTimeout(timer);

    isPlaying = false;
    playedSeconds = 0;

    const song = shuffledSongs[currentIndex];

    document.getElementById("questionNumber").textContent =
      `第 ${currentIndex + 1} 題`;

    document.getElementById("answer").textContent =
      song.title;

    document.getElementById("answer").classList.add("hidden");

    document.getElementById("playButton").disabled = false;
    document.getElementById("playButton").textContent =
      "▶️ 播放前奏";

    document.getElementById("answerButton").disabled = false;
    document.getElementById("nextButton").disabled = true;

    document.getElementById("status").textContent =
      "已播放 0 秒";

    document.getElementById("cover").classList.remove("hidden");

    if (player && player.loadVideoById) {
      player.loadVideoById(song.id);
      player.pauseVideo();
    }
  }


  // YouTube API 載入完成
  function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

      videoId: songs[0].id,

      playerVars: {
        autoplay: 0,
        controls: 0,
        rel: 0,
        playsinline: 1
      },

      events: {
        onReady: function() {
          prepareGame();
        },

        onStateChange: function(event) {

          if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
          }

          if (event.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
          }
        }
      }
    });
  }


  // 播放一段
  function playSegment(seconds) {

    if (!player) return;

    clearTimeout(timer);

    document.getElementById("cover").classList.add("hidden");

    player.playVideo();

    isPlaying = true;

    timer = setTimeout(function() {

      player.pauseVideo();

      isPlaying = false;

      playedSeconds += seconds;

      document.getElementById("status").textContent =
        `已播放 ${playedSeconds} 秒`;

      updatePlayButton();

    }, seconds * 1000);
  }


  // 第一次播放
  function playIntro() {

    if (isPlaying) return;

    // 第一次從 0 秒開始
    if (playedSeconds === 0) {

      player.seekTo(0, true);

      playSegment(firstPlaySeconds);

    } else {

      // 後續每次從目前位置繼續播放 5 秒
      playSegment(continuePlaySeconds);
    }

    updatePlayButton();
  }


  function updatePlayButton() {

    const button = document.getElementById("playButton");

    if (isPlaying) {

      button.disabled = true;
      button.textContent = "🎵 播放中...";

    } else {

      button.disabled = false;

      if (playedSeconds === 0) {
        button.textContent = "▶️ 播放前奏";
      } else {
        button.textContent =
          `▶️ 繼續播放 5 秒`;
      }
    }
  }


  // 公布答案
  function showAnswer() {

    clearTimeout(timer);

    if (player) {
      player.pauseVideo();
    }

    isPlaying = false;

    document.getElementById("answer").classList.remove("hidden");

    document.getElementById("nextButton").disabled = false;

    document.getElementById("playButton").disabled = true;

    document.getElementById("status").textContent =
      `本題共播放 ${playedSeconds} 秒`;
  }


  // 下一題
  function nextSong() {

    currentIndex++;

    // 3 題全部結束
    if (currentIndex >= shuffledSongs.length) {

      alert("🎉 3 題測試完成！");

      shuffledSongs = shuffle(songs);
      currentIndex = 0;
    }

    loadSong();
  }


  // 開始
  window.addEventListener("load", function() {

    // YouTube API 會自己呼叫 onYouTubeIframeAPIReady
  });

</script>

</body>
</html>
